<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 434 296">
  <!-- the ends roll back: the left edge and the top catch the light, the right and the bottom turn away -->
  <rect x="0" y="20" width="4" height="256" fill="#fff" fill-opacity="0.40"/>
  <rect x="20" y="0" width="394" height="3" fill="#fff" fill-opacity="0.30"/>
  <rect x="430" y="20" width="4" height="256" fill="#000" fill-opacity="0.45"/>
  <rect x="20" y="293" width="394" height="3" fill="#000" fill-opacity="0.35"/>
  <!-- the raised pillars either side of the label, rounded off towards the ends -->
  <rect x="4" y="8" width="26" height="280" fill="#fff" fill-opacity="0.10"/>
  <rect x="404" y="8" width="26" height="280" fill="#000" fill-opacity="0.22"/>
  <!-- the well the whole label sits in: a groove down each side of it and along its foot -->
  <rect x="53" y="4" width="3" height="255" fill="#000" fill-opacity="0.85"/>
  <rect x="378" y="4" width="3" height="255" fill="#000" fill-opacity="0.85"/>
  <rect x="56" y="259" width="322" height="3" fill="#000" fill-opacity="0.85"/>
  <rect x="56" y="262" width="322" height="1.5" fill="#fff" fill-opacity="0.18"/>
</svg>
